<!DOCTYPE html>
<html>
<head>
    <title>Subscription Plan</title>
    <style>
        /* Popup background */
        #popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        /* Popup image */
        #popup img {
            width: 90%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 15px #000;
        }

        /* Buy Now button styling */
        #buyBtn {
            padding: 12px 20px;
            background: blue;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Welcome to Subscription Plan Site</h1>

    <!-- Buy Button -->
    <button id="buyBtn">Buy Now</button>

    <!-- Popup Box -->
    <div id="popup">
        <img src="plan.jpg" alt="Plan Image">
    </div>

    <script>
        const popup = document.getElementById("popup");
        const btn = document.getElementById("buyBtn");

        // Show popup
        btn.onclick = () => {
            popup.style.display = "flex";
        };

        // Hide popup when clicking anywhere
        popup.onclick = () => {
            popup.style.display = "none";
        };
    </script>

</body>
</html>
