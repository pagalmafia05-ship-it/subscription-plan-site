<!DOCTYPE html>
<html>
<head>
    <title>Subscription Plan</title>
    <style>
        /* Popup background */
        #popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        /* Popup image box */
        #popup img {
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Welcome to Subscription Plan Site</h1>

    <!-- Buy Button -->
    <button id="buyBtn">Buy Now</button>

    <!-- Popup Box -->
    <div id="popup">
        <img src="plan.jpg" alt="Plan Image">
    </div>

    <script>
        let popup = document.getElementById("popup");
        let btn = document.getElementById("buyBtn");

        btn.onclick = function () {
            popup.style.display = "flex";
        };

        popup.onclick = function () {
            popup.style.display = "none";
        };
    </script>

</body>
</html>
